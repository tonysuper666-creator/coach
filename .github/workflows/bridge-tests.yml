name: Bridge tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # 这些测试会读 server/*/src/main/kotlin，所以要完整检出后在仓库根目录跑；全离线，不碰任何密钥。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            /tmp/bridge-venv
          key: ${{ runner.os }}-bridge-deps-${{ hashFiles('tools/bridge/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-bridge-deps-
      - name: Install bridge requirements
        run: |
          if /tmp/bridge-venv/bin/python -c "import fastapi, uvicorn, pydantic, httpx" 2>/dev/null; then
            echo "Using cached bridge virtualenv"
            exit 0
          fi
          delays=(5 15 30)
          attempt=0
          while true; do
            rm -rf /tmp/bridge-venv
            if python3 -m venv /tmp/bridge-venv && /tmp/bridge-venv/bin/python -m pip install --disable-pip-version-check -q -r tools/bridge/requirements.txt; then
              exit 0
            fi
            if [ "$attempt" -ge "${#delays[@]}" ]; then
              echo "::error::依赖仓库不可用，不是代码问题（Bridge 依赖安装重试 ${#delays[@]} 次后仍失败）"
              exit 1
            fi
            delay="${delays[$attempt]}"
            attempt=$((attempt + 1))
            echo "::warning::Bridge 依赖安装失败，将在 ${delay}s 后自动重试（第 ${attempt}/${#delays[@]} 次）"
            sleep "$delay"
          done
      - name: Run bridge tests
        run: |
          set -e
          for t in api_routing batch_routing friends friend_usage exam_protection friend_study_contract test_price_floor test_raise_coach_share test_monthly_grant_plan; do
            echo "::group::$t"
            /tmp/bridge-venv/bin/python tools/bridge/tests/$t.py
            echo "::endgroup::"
          done
