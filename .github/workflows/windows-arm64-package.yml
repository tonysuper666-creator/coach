name: Windows ARM64 package and smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to package (major.minor.patch; defaults to 1.1.0)
        type: string
        default: '1.1.0'
      version_code:
        description: Monotonic versionCode paired with version (defaults to 3)
        type: string
        default: '3'
      sable_login:
        description: Enable Sable login entry in the built MSI
        type: choice
        options: ['true', 'false']
        default: 'true'
      private_friend_url:
        description: Release build — embed the private friend service origin from the COACH_FRIEND_URL secret (masked; artifact kept 1 day; smoke skipped)
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-11-arm
    timeout-minutes: 60
    outputs:
      msi_name: ${{ steps.prepare.outputs.msi_name }}
      msi_sha256: ${{ steps.prepare.outputs.msi_sha256 }}
      msi_bytes: ${{ steps.prepare.outputs.msi_bytes }}
      release_version: ${{ steps.prepare.outputs.release_version }}
      sable_login: ${{ steps.prepare.outputs.sable_login }}
    env:
      RELEASE_VERSION: ${{ inputs.version || '1.1.0' }}
      RELEASE_VERSION_CODE: ${{ inputs.version_code || '3' }}
      SABLE_LOGIN: ${{ inputs.sable_login || 'true' }}
      PRIVATE_FRIEND_URL: ${{ inputs.private_friend_url || 'false' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          # Keep Java 17 aligned with x64; Temurin's 17.0.20 release has no
          # Windows ARM64 JDK, while Microsoft publishes a native build.
          distribution: microsoft
          java-version: '17'
          architecture: aarch64
      - name: Record host and Java architecture
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw "Expected ARM64 host, got $env:PROCESSOR_ARCHITECTURE" }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $env:RELEASE_VERSION" }
          if ($env:RELEASE_VERSION_CODE -notmatch '^\d+$') { throw "Invalid version_code: $env:RELEASE_VERSION_CODE" }
          if ($env:SABLE_LOGIN -notin @('true', 'false')) { throw "Invalid sable_login: $env:SABLE_LOGIN" }
          java -XshowSettings:properties -version 2>&1 | Tee-Object java-settings.txt
          if (-not (Select-String -Path java-settings.txt -Pattern 'os.arch\s*=\s*aarch64')) { throw 'JDK is not ARM64' }
      - name: Run ARM64 update-arch and Sable login tests
        shell: bash
        env:
          COACH_HEAVY_HOST: local
        run: |
          tools/dev/heavy ./gradlew :desktopApp:test \
            --tests com.coach.desktop.WindowsUpdateTest \
            --tests com.coach.desktop.books.SableLoginEntryTest \
            --console=plain --max-workers=2
      - name: Build native ARM64 MSI
        shell: bash
        env:
          COACH_HEAVY_HOST: local
          COACH_FRIEND_URL: ${{ inputs.private_friend_url == 'true' && secrets.COACH_FRIEND_URL || '' }}
          COACH_UPDATE_CHANNEL: ${{ inputs.private_friend_url == 'true' && secrets.COACH_UPDATE_CHANNEL || '' }}
        run: |
          friend_args=()
          if [[ "$PRIVATE_FRIEND_URL" == true ]]; then
            [[ -n "$COACH_FRIEND_URL" ]] || { echo "private_friend_url=true but the COACH_FRIEND_URL secret is empty" >&2; exit 1; }
            friend_args=("-Pcoach.friendUrl=$COACH_FRIEND_URL")
            # Release builds must carry the in-app update channel, otherwise installed copies never see a new version.
            [[ -n "$COACH_UPDATE_CHANNEL" ]] || { echo "private_friend_url=true but the COACH_UPDATE_CHANNEL secret is empty" >&2; exit 1; }
            channel_file="$RUNNER_TEMP/windows-update-channel.txt"
            printf '%s' "$COACH_UPDATE_CHANNEL" > "$channel_file"
            export COACH_UPDATE_CHANNEL_FILE="$channel_file"
          fi
          tools/dev/heavy ./gradlew :desktopApp:verifyReleaseVersion :desktopApp:packageMsi \
            -Pcoach.release=true \
            -Pcoach.release.version="$RELEASE_VERSION" \
            -Pcoach.release.versionCode="$RELEASE_VERSION_CODE" \
            -Pcoach.sableLogin="$SABLE_LOGIN" \
            "${friend_args[@]}" \
            --console=plain --max-workers=2
      - name: Audit MSI metadata, AA64 binaries, and OCR bundle
        id: prepare
        shell: powershell
        env:
          COACH_FRIEND_URL: ${{ inputs.private_friend_url == 'true' && secrets.COACH_FRIEND_URL || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          $sable = $env:SABLE_LOGIN
          $msiFile = Join-Path 'desktopApp/build/compose/binaries/main/msi' "LearningCoach-$version.msi"
          if (-not (Test-Path -LiteralPath $msiFile)) {
            $found = @(Get-ChildItem 'desktopApp/build/compose/binaries/main/msi/*.msi' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
            throw "Expected $msiFile, found: $($found -join ', ')"
          }
          $msiFull = (Resolve-Path -LiteralPath $msiFile).Path

          # Verify MSI Property table (ProductVersion, UpgradeCode, per-user ALLUSERS)
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.OpenDatabase($msiFull, 0)
          $props = @{}
          $view = $db.OpenView("SELECT Property, Value FROM Property")
          $view.Execute()
          while ($rec = $view.Fetch()) {
            $props[$rec.StringData(1)] = $rec.StringData(2)
            [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($rec)
          }
          $view.Close()
          [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($view)
          [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($db)
          [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($installer)
          [GC]::Collect()
          [GC]::WaitForPendingFinalizers()

          if ($props['ProductName'] -ne 'LearningCoach') { throw "Unexpected ProductName: $($props['ProductName'])" }
          if ($props['ProductVersion'] -ne $version) { throw "Unexpected ProductVersion: $($props['ProductVersion'])" }
          if ($props['UpgradeCode'].ToLowerInvariant() -ne '{6f1b0a52-6c4d-4d3f-9a1e-2b7c5d84e910}') {
            throw "Unexpected UpgradeCode: $($props['UpgradeCode'])"
          }
          if ($props.ContainsKey('ALLUSERS') -and $props['ALLUSERS'] -notin @('', '2')) {
            throw "Expected per-user install, got ALLUSERS=$($props['ALLUSERS'])"
          }

          New-Item -ItemType Directory -Force candidate | Out-Null
          $candidateDir = (Resolve-Path candidate).Path
          $msiName = "LearningCoach-$version-arm64.msi"
          $dest = Join-Path $candidateDir $msiName
          Copy-Item -LiteralPath $msiFull -Destination $dest

          $friendFlag = if ($env:PRIVATE_FRIEND_URL -eq 'true') { '--require-friend-url' } else { '--forbid-private-config' }
          python tools/smoke/audit-arm64-msi.py --msi $dest --sable-login $sable $friendFlag --out candidate/audit.txt
          if ($LASTEXITCODE -ne 0) { throw "ARM64 MSI audit failed with exit $LASTEXITCODE" }
          if ($env:PRIVATE_FRIEND_URL -eq 'true') {
            # The update channel lives in the desktop jar as /windows-update-channel.txt; a release MSI without it is rejected.
            $x = Join-Path $env:RUNNER_TEMP 'msi-x'
            msiexec /a $dest /qn TARGETDIR=$x | Out-Null
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $hit = $false
            foreach ($j in Get-ChildItem -Path $x -Recurse -Filter *.jar) {
              $z = [IO.Compression.ZipFile]::OpenRead($j.FullName)
              try { if ($z.Entries | Where-Object { $_.FullName -eq 'windows-update-channel.txt' }) { $hit = $true } } finally { $z.Dispose() }
              if ($hit) { break }
            }
            if (-not $hit) { throw 'Release MSI has no windows-update-channel.txt' }
            'update_channel=injected' | Out-File -FilePath (Join-Path $candidateDir 'audit.txt') -Append -Encoding utf8
          }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $meta = "msi_product_version=$($props['ProductVersion'])`nmsi_upgrade_code=$($props['UpgradeCode'])`nmsi_allusers=$($props['ALLUSERS'])`n"
          [IO.File]::AppendAllText((Join-Path $candidateDir 'audit.txt'), $meta, $utf8)

          $hash = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item -LiteralPath $dest).Length
          [IO.File]::WriteAllText((Join-Path $candidateDir 'commit.txt'), $env:GITHUB_SHA, $utf8)
          [IO.File]::WriteAllText((Join-Path $candidateDir 'sha256.txt'), "$hash  $msiName`n", $utf8)

          "msi_name=$msiName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          "msi_sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          "msi_bytes=$bytes" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          "release_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          "sable_login=$sable" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
      - name: Encrypt release candidate before upload
        # Artifacts of a public repository can be downloaded by any signed-in GitHub user while they are retained.
        # A release MSI embeds the private friend origin and update channel, so only ciphertext may leave the runner:
        # a fresh AES-256 key encrypts the MSI, and that key is wrapped with the release public key whose private half
        # exists only on the release Mac (tools/release/arm64-candidate.pub.pem).
        if: ${{ inputs.private_friend_url == 'true' }}
        shell: bash
        env:
          MSI_NAME: ${{ steps.prepare.outputs.msi_name }}
        run: |
          set -euo pipefail
          cd candidate
          [[ -f "$MSI_NAME" ]] || { echo "missing $MSI_NAME" >&2; exit 1; }
          key="$RUNNER_TEMP/candidate.key"
          openssl rand -out "$key" 32
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$MSI_NAME" -out "$MSI_NAME.enc" -pass "file:$key"
          openssl pkeyutl -encrypt -pubin -inkey ../tools/release/arm64-candidate.pub.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$key" -out "$MSI_NAME.key.enc"
          rm -f "$MSI_NAME" "$key"
          ls -l
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-arm64-package-candidate
          path: candidate/
          retention-days: ${{ inputs.private_friend_url == 'true' && 1 || 7 }}
          if-no-files-found: error

  smoke:
    needs: package
    # A release build embeds the private origin; its acceptance runs on winbox against the real service instead.
    if: ${{ inputs.private_friend_url != 'true' }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    env:
      MSI_NAME: ${{ needs.package.outputs.msi_name }}
      MSI_SHA256: ${{ needs.package.outputs.msi_sha256 }}
      RELEASE_VERSION: ${{ needs.package.outputs.release_version }}
      SABLE_LOGIN: ${{ needs.package.outputs.sable_login }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record ARM64 runner facts
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw "Expected ARM64 host, got $env:PROCESSOR_ARCHITECTURE" }
          New-Item -ItemType Directory -Force evidence | Out-Null
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE" | Tee-Object evidence/machine.txt
          (Get-CimInstance Win32_Processor | Select-Object -First 1 Name).Name | Tee-Object -Append evidence/machine.txt
          [System.Environment]::OSVersion.VersionString | Tee-Object -Append evidence/machine.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-arm64-package-candidate
          path: bundle
      - name: Verify installer SHA-256
        id: verify
        shell: pwsh
        run: |
          $msiPath = Join-Path 'bundle' $env:MSI_NAME
          $h = (Get-FileHash -LiteralPath $msiPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "msi_sha256=$h" | Tee-Object -Append evidence/machine.txt
          if ($h -ne $env:MSI_SHA256) { throw "Unexpected installer hash: $h != $env:MSI_SHA256" }
          Copy-Item -LiteralPath 'bundle/audit.txt' -Destination 'evidence/audit.txt'
      - name: Dismiss foreground runner blocker
        shell: powershell
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw 'Expected disposable ARM runner' }
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class PrismForeground {
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
          }
          '@
          $owner = 0
          [PrismForeground]::GetWindowThreadProcessId([PrismForeground]::GetForegroundWindow(), [ref]$owner) | Out-Null
          $front = Get-Process -Id $owner -ErrorAction SilentlyContinue
          if ($front -and $front.ProcessName -eq 'WWAHost') { Stop-Process -Id $owner -Force; "Closed foreground WWAHost $owner" }
      - name: Install MSI, launch and capture desktop screenshots
        shell: powershell
        run: ./tools/smoke/msi-install.ps1 -Msi "bundle/$env:MSI_NAME" -OutDir evidence/install -StartTimeoutSec 300 -KeepInstalled
      - name: Verify installed version and Sable login flag
        shell: pwsh
        run: |
          $res = Get-Content -Raw -Encoding UTF8 'evidence/install/result.json' | ConvertFrom-Json
          if ($res.product.version -ne $env:RELEASE_VERSION) {
            throw "Installed version mismatch: $($res.product.version) != $env:RELEASE_VERSION"
          }
          $cfg = Get-Content -Raw -Encoding UTF8 'evidence/install/launcher.cfg'
          $expected = "java-options=-Dcoach.sableLogin=$($env:SABLE_LOGIN)"
          if ($cfg -notmatch [Regex]::Escape($expected)) {
            throw "Missing $expected in installed launcher.cfg"
          }
          Write-Output "Verified installed product version=$($res.product.version) and $expected"
      - name: Run 7-step friend path with ARM64 OCR and loopback tutor
        if: ${{ always() && steps.verify.outcome == 'success' }}
        shell: powershell
        run: |
          ./tools/smoke/prism-ocr.ps1 -OutDir evidence/scan -Fixture 'desktopApp/src/test/resources/books/ocr/three-scanned-pages.pdf' -InstallResult evidence/install/result.json
      - name: Uninstall isolated test package
        if: always()
        shell: powershell
        run: |
          $paths = @('HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*')
          $products = @(Get-ItemProperty $paths -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq 'LearningCoach' })
          if ($products.Count -gt 1) { throw 'Unexpected multiple LearningCoach installations' }
          if ($products.Count -eq 1) {
            $p = Start-Process msiexec.exe -ArgumentList @('/x', $products[0].PSChildName, '/qn', '/norestart') -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Uninstall failed: $($p.ExitCode)" }
            $left = @(Get-ItemProperty $paths -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq 'LearningCoach' })
            if ($left.Count) { throw 'LearningCoach still appears in the uninstall registry' }
            Write-Output 'Uninstall completed and registry entry is gone'
          } else {
            if (Test-Path 'evidence/install/result.json') {
              $result = Get-Content -Raw -Encoding UTF8 'evidence/install/result.json' | ConvertFrom-Json
              if ($result.installedTo -and (Test-Path (Join-Path $result.installedTo 'LearningCoach.exe'))) { throw 'Installed app remains but registry entry was not found' }
            }
            Write-Output 'No LearningCoach installation found to uninstall'
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-arm64-smoke-evidence
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
