<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; script-src 'sha256-__SCRIPT_HASH__'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>裁片复核 · 本机</title>
<style>
:root {color-scheme:light dark;--paper:#faf7ef;--ink:#282b27;--line:#cecbbf;--muted:#62675c;--accent:#335b48;--field:#fffdf7}
* {box-sizing:border-box} body {margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
header {padding:14px 24px;border-bottom:1px solid var(--line);display:flex;gap:20px;align-items:center;flex-wrap:wrap}
h1 {font:600 23px/1.2 Georgia,serif;margin:0} header p {margin:0;color:var(--muted);flex:1}
button,select,.file {font:inherit;color:inherit;background:var(--field);border:1px solid var(--line);border-radius:3px;padding:7px 12px;cursor:pointer}
button:hover,.file:hover {border-color:var(--accent)} button:focus-visible,select:focus-visible,.file:focus-within {outline:2px solid var(--accent);outline-offset:2px}
button:disabled {opacity:.45;cursor:default} .primary {background:var(--accent);color:#fff;border-color:var(--accent)}
.file input {width:1px;height:1px;position:absolute;opacity:0} main {display:grid;grid-template-columns:230px minmax(0,1fr);height:calc(100vh - 84px)}
nav {padding:14px;border-right:1px solid var(--line);overflow:auto} #progress {color:var(--muted);margin:0 0 12px}
#list button {display:block;text-align:left;width:100%;margin:0 0 6px;overflow-wrap:anywhere} #list button[aria-current=true] {border:2px solid var(--accent);padding:6px 11px}
.work {min-width:0;display:flex;flex-direction:column;padding:16px 20px;gap:12px;overflow:auto}
.toolbar {display:flex;gap:10px;align-items:center;flex-wrap:wrap} #name {font-weight:600;overflow-wrap:anywhere;margin-right:auto}
.panes {display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:240px;flex:1}
.panes.comparing {grid-template-columns:1fr 1fr 1fr}
.pane {display:flex;flex-direction:column;min-width:0;min-height:0} h2 {font-size:15px;font-weight:500;margin:0 0 6px}
.pane[hidden] {display:none} .compare-controls {display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.compare-controls select {min-width:0;width:100%} #compareStatus {margin:0 0 6px;color:var(--muted);overflow-wrap:anywhere}
.viewport {background:#dddcd7;border:1px solid var(--line);overflow:auto;flex:1;min-height:220px;position:relative}
.canvas {position:relative;width:100%;line-height:0} .canvas img {display:block;width:100%;height:auto;max-width:none}
.marker {position:absolute;border:2px solid #a85c1b;pointer-events:none}.marker.current {border:3px solid #087a42;box-shadow:0 0 0 1px #fff}
.marker.compared {border:3px dashed #2768c4;box-shadow:0 0 0 1px #fff}
.marker.draft {border:3px dashed #b24820} #pageCanvas.drawing {cursor:crosshair;touch-action:none;user-select:none}
.editor {border:1px solid var(--line);padding:10px;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.editor input {font:inherit;color:inherit;background:var(--field);border:1px solid var(--line);padding:5px;width:80px}
.editor p {flex-basis:100%;margin:0;color:var(--muted);font-size:13px}
.checks {display:flex;gap:12px 24px;flex-wrap:wrap} .checks label {cursor:pointer} input[type=checkbox] {accent-color:var(--accent);width:16px;height:16px;vertical-align:middle}
.decision {display:flex;align-items:center;gap:10px;flex-wrap:wrap} #status {color:var(--muted);margin-right:auto}
#message {min-height:24px;color:var(--muted);margin:0} .note {font-size:13px;color:var(--muted);margin:0}
@media (prefers-color-scheme:dark) {:root {--paper:#232723;--ink:#eeeade;--line:#53594f;--muted:#bdc2b6;--accent:#377454;--field:#2c312b}.viewport {background:#41453f}}
@media (max-width:950px) {main {grid-template-columns:170px 1fr;height:auto;min-height:calc(100vh - 84px)} .panes,.panes.comparing {grid-template-columns:1fr}.viewport {height:48vh;flex:auto} .work {overflow:visible} header {padding:12px 16px} header p {flex-basis:100%}}
</style>
<header><h1>裁片复核</h1><p>对照原页逐张检查。所有内容仅在本机打开。</p>
<label class="file">继续上次复核<input id="resume" type="file" accept="application/json,.json"></label>
<button id="save">保存复核进度</button></header>
<main><nav aria-label="裁片列表"><p id="progress"></p><div id="list"></div></nav>
<section class="work" aria-label="当前裁片">
<div class="toolbar"><span id="name"></span><button id="previous">上一张</button><button id="next">下一张</button>
<label>缩放 <select id="zoom"><option value="fit">适合宽度</option><option value="1">原尺寸 100%</option><option value="2">放大 200%</option></select></label></div>
<div class="panes">
<section class="pane"><h2>完整原页 · 绿框为当前裁片，蓝框为对照裁片</h2><div class="viewport" id="pageView"><div class="canvas" id="pageCanvas"><img id="page" alt="完整原页" draggable="false"><div id="markers"></div></div></div></section>
<section class="pane"><h2>裁片 · 请切到原尺寸检查边缘与小字</h2><div class="viewport" id="cropView"><div class="canvas" id="cropCanvas"><img id="crop" alt="当前裁片"></div></div></section>
<section class="pane" id="comparison" aria-label="比较相交裁片" hidden>
<h2 id="compareHeading">比较相交裁片</h2>
<div class="compare-controls"><select id="compareChoice" aria-label="选择相交裁片"></select><button id="openComparison">切到这张继续复核</button></div>
<p id="compareStatus"></p>
<div class="viewport" id="compareView"><div class="canvas" id="compareCanvas"><img id="compareCrop" alt="相交裁片的原预览"></div></div>
<p class="note">这里只列与当前原框直接相交的裁片。相交不代表同一对象；请对照原页检查，所有版本都保留。</p>
</section>
</div>
<div class="editor" aria-label="调整裁图边界">
<button id="draw" aria-pressed="false">在原页重新画框</button>
<label>左 <input id="left" type="number" min="0" step="1"></label><label>上 <input id="top" type="number" min="0" step="1"></label>
<label>右 <input id="right" type="number" min="1" step="1"></label><label>下 <input id="bottom" type="number" min="1" step="1"></label>
<button id="setEdges">应用边界</button><button id="discardEdit">撤销改框</button>
<label class="file">恢复改框草稿<input id="resumeEdits" type="file" accept="application/json,.json"></label>
<button id="saveEdits">下载改框请求</button>
<p id="editNote">可重画或用原图像素微调，把标题、图注和来源一起框住。改框后须重新生成预览，再逐张批准。</p>
</div>
<div class="checks">
<label><input type="checkbox" id="wholeObject">主体完整，无截断</label>
<label><input type="checkbox" id="labels">标题、图注、表注和来源齐全</label>
<label><input type="checkbox" id="noProseOrDuplicate">不混入正文，只保留完整的一份</label>
</div>
<div class="decision"><span id="status" role="status"></span><button id="reset">留待复核</button><button id="reject">拒绝这张</button><button id="approve" class="primary">批准完整对象</button><button id="replaceApproval" hidden></button></div>
<p id="message" role="alert"></p><p class="note">保存后会下载复核文件。只有明确批准的对象才能导出入库；未审和拒绝的对象不会入库。关闭前请保存进度。勾选是人工声明，不能代替对照原页。</p>
</section></main>
<script id="batch" type="application/json">__BATCH__</script>
<script id="app">
"use strict";
const batch = JSON.parse(document.getElementById("batch").textContent);
const $ = id => document.getElementById(id);
const labels = {UNREVIEWED:"待复核", COMPLETE_OBJECT_WITH_LABELS:"已批准", REJECTED:"已拒绝"};
const checkIds = ["wholeObject", "labels", "noProseOrDuplicate"];
let rows = batch.items.map(item => ({id:item.id, review:item.review, decision:"UNREVIEWED",
  checks:Object.fromEntries(checkIds.map(id => [id,false]))}));
let index = 0, loaded = false, generation = 0, dirty = false;
let edits = rows.map(() => null), drawing = false, drag = null;
let compareIndex = null;
const edges = ["left", "top", "right", "bottom"];
function overlaps(a,b) {return a.page===b.page && a.left<b.right && b.left<a.right && a.top<b.bottom && b.top<a.bottom;}
function message(text) {$("message").textContent = text;}
function stats() {
  const count = key => rows.filter(row => row.decision === key).length;
  $("progress").textContent = `${rows.length} 张 · 已批准 ${count("COMPLETE_OBJECT_WITH_LABELS")} · 已拒绝 ${count("REJECTED")} · 待复核 ${count("UNREVIEWED")}`;
  $("list").replaceChildren(...rows.map((row,i) => {
    const button = document.createElement("button");
    button.textContent = `${i+1}. ${row.id} · ${labels[row.decision]}`;
    button.setAttribute("aria-current", String(index===i));
    button.addEventListener("click", () => show(i)); return button;
  }));
  $("status").textContent = edits[index] ? "改框草稿 · 须重新生成预览" : labels[rows[index].decision];
  renderComparison(); updateApproval();
}
function conflicts() {
  return rows.filter((r,i)=>i!==index && r.decision==="COMPLETE_OBJECT_WITH_LABELS" &&
    overlaps(rows[index].review.selection,r.review.selection));
}
function updateApproval() {
  const disabled = !loaded || !!edits[index] || drawing || !checkIds.every(id => $(id).checked);
  $("approve").disabled = disabled;
  const count=conflicts().length;
  $("replaceApproval").hidden = count===0;
  $("replaceApproval").disabled = disabled || count===0;
  $("replaceApproval").textContent = `改用当前裁片，撤销 ${count} 张相交批准`;
  for (const id of checkIds) $(id).disabled = !!edits[index] || drawing;
}
function renderComparison() {
  const s=rows[index].review.selection;
  const peers=rows.map((r,i)=>i).filter(i=>i!==index && overlaps(s,rows[i].review.selection));
  if(!peers.includes(compareIndex)) compareIndex=peers[0] ?? null;
  $("comparison").hidden=peers.length===0;
  document.querySelector(".panes").classList.toggle("comparing",peers.length>0);
  $("compareHeading").textContent=`比较相交裁片 · ${peers.length} 张`;
  $("compareChoice").replaceChildren(...peers.map(i=>{
    const option=document.createElement("option");option.value=String(i);
    option.textContent=`${rows[i].id} · ${edits[i] ? "有改框草稿" : labels[rows[i].decision]}`;
    return option;
  }));
  renderMarkers();
  if(compareIndex===null) {$("compareCrop").removeAttribute("src");return;}
  $("compareChoice").value=String(compareIndex);
  $("compareStatus").textContent=edits[compareIndex] ? "原预览 · 此版本有改框草稿，须重新生成预览" :
    `原预览 · ${labels[rows[compareIndex].decision]}`;
  if($("compareCrop").getAttribute("src")!==batch.items[compareIndex].image) {
    $("compareCrop").src=batch.items[compareIndex].image;
    $("compareView").scrollTop=0;$("compareView").scrollLeft=0;
  }
  zoom();
}
function zoom() {
  const scale = $("zoom").value;
  for (const [canvas, img] of [["pageCanvas","page"],["cropCanvas","crop"],["compareCanvas","compareCrop"]]) {
    const s=img==="crop" ? (edits[index] || rows[index].review.selection) :
      img==="compareCrop" && compareIndex!==null ? rows[compareIndex].review.selection : null;
    const width=s ? s.right-s.left : $(img).naturalWidth;
    $(canvas).style.width = scale === "fit" ? "100%" : `${width * Number(scale)}px`;
  }
}
async function show(next) {
  setDrawing(false);
  index = next; const token = ++generation; loaded = false; updateApproval(); message("");
  const row = rows[index], s = row.review.selection, context = batch.pages[s.page];
  $("name").textContent = `${index+1} / ${rows.length} · ${row.id} · 第 ${s.page} 页`;
  $("previous").disabled = index===0; $("next").disabled = index===rows.length-1;
  for (const id of checkIds) $(id).checked = row.checks[id];
  $("page").src = context.image; $("crop").src = batch.items[index].image;
  renderMarkers();
  for (const id of ["pageView","cropView"]) {$(id).scrollTop=0; $(id).scrollLeft=0;}
  stats();
  try {await Promise.all([$("page").decode(),$("crop").decode()]);
    if (token!==generation) return;
    loaded=true; renderEdit(); zoom(); updateApproval();
  } catch {if(token===generation) message("图片未能完整打开，请重新生成预览。");}
}
function renderMarkers() {
  const row=rows[index], s=row.review.selection, context=batch.pages[s.page];
  $("markers").replaceChildren(...rows.filter(r => r.review.selection.page===s.page).map(r => {
    const marker = document.createElement("div"), box = r.review.selection;
    marker.className = `marker${r===row ? " current" : r===rows[compareIndex] ? " compared" : ""}`;
    Object.assign(marker.style, {left:`${100*box.left/context.width}%`,top:`${100*box.top/context.height}%`,
      width:`${100*(box.right-box.left)/context.width}%`,height:`${100*(box.bottom-box.top)/context.height}%`});
    return marker;
  }));
  if (edits[index]) {
    const box=edits[index], marker=document.createElement("div"); marker.className="marker draft";
    Object.assign(marker.style,{left:`${100*box.left/context.width}%`,top:`${100*box.top/context.height}%`,
      width:`${100*(box.right-box.left)/context.width}%`,height:`${100*(box.bottom-box.top)/context.height}%`});
    $("markers").append(marker);
  }
}
function renderEdit() {
  const s=edits[index] || rows[index].review.selection;
  for (const key of edges) $(key).value=s[key];
  $("discardEdit").disabled=!edits[index]; $("saveEdits").disabled=!edits.some(Boolean);
  $("editNote").textContent=edits[index] ? "右图是改框草稿（橙色虚线），不能批准。下载改框请求后重新生成生产预览，再从待复核开始。" :
    "可重画或用原图像素微调，把标题、图注和来源一起框住。改框后须重新生成预览，再逐张批准。";
  if (edits[index]) {
    const canvas=document.createElement("canvas"); canvas.width=s.right-s.left; canvas.height=s.bottom-s.top;
    canvas.getContext("2d").drawImage($("page"),s.left,s.top,canvas.width,canvas.height,0,0,canvas.width,canvas.height);
    $("crop").src=canvas.toDataURL("image/png");
  } else $("crop").src=batch.items[index].image;
  // Use the selection width immediately; the previous image may still be decoding.
  $("cropCanvas").style.width=$("zoom").value==="fit" ? "100%" : `${(s.right-s.left)*Number($("zoom").value)}px`;
  renderMarkers(); stats(); updateApproval();
}
function validSelection(s, original) {
  const context=batch.pages[original.page];
  return s && Object.keys(s).length===6 && s.page===original.page && s.kind===original.kind &&
    edges.every(k=>Number.isInteger(s[k])) && s.left>=0 && s.top>=0 && s.left<s.right && s.top<s.bottom &&
    s.right<=context.width && s.bottom<=context.height;
}
function changeSelection(s) {
  const row=rows[index], original=row.review.selection;
  if (!validSelection(s,original)) {message("边界须为页内整数像素，且左小于右、上小于下。当前裁片未改变。");return;}
  edits[index]=edges.every(k=>s[k]===original[k]) ? null : s;
  row.decision="UNREVIEWED"; row.checks=Object.fromEntries(checkIds.map(id=>[id,false]));
  for (const id of checkIds) $(id).checked=false;
  dirty=true; renderEdit(); message("边界已更新；原批准已撤销。新框须重新生成预览并复核。");
}
function setDrawing(value) {
  drawing=value; drag=null; $("pageCanvas").classList.toggle("drawing",value);
  $("draw").setAttribute("aria-pressed",String(value));
  $("draw").textContent=value ? "取消画框" : "在原页重新画框"; updateApproval();
  if (!value) renderMarkers();
}
function point(event) {
  const rect=$("page").getBoundingClientRect(), page=batch.pages[rows[index].review.selection.page];
  return {x:Math.max(0,Math.min(page.width,(event.clientX-rect.left)*page.width/rect.width)),
    y:Math.max(0,Math.min(page.height,(event.clientY-rect.top)*page.height/rect.height))};
}
function decide(decision, replace=false) {
  const row = rows[index];
  let revoked=0;
  if (decision==="COMPLETE_OBJECT_WITH_LABELS") {
    if (!loaded || edits[index] || drawing || !checkIds.every(id => $(id).checked)) return;
    const others=conflicts();
    if (others.length && !replace) {
      message("与已批准裁片重叠。请比较版本；确认改用当前裁片时，可撤销相交批准。"); return;
    }
    // Explicitly revoke only direct conflicts, never transitive neighbours or all same-page items.
    // Revoked versions remain available for review; intersection is not semantic duplication.
    for (const other of others) {
      other.decision="UNREVIEWED";other.checks=Object.fromEntries(checkIds.map(id=>[id,false]));revoked++;
    }
  }
  row.decision = decision; dirty=true; stats();
  message(revoked ? `已批准当前裁片；${revoked} 张相交批准已撤销并清空勾选，保留待复核。请保存进度。` : "已记录，请保存复核进度。");
}
function validateResume(saved) {
  if (!saved || saved.schema!==1 || !Array.isArray(saved.items) || saved.items.length!==rows.length) throw Error();
  const byId = new Map(saved.items.map(row => [row.id,row]));
  if (byId.size!==rows.length) throw Error();
  const restored = rows.map(draft => {
    const row = byId.get(draft.id);
    if (!row || !Object.hasOwn(labels,row.decision) || JSON.stringify(row.review)!==JSON.stringify(draft.review) ||
        !row.checks || Object.keys(row.checks).length!==3 || !checkIds.every(id => typeof row.checks[id]==="boolean") ||
        (row.decision==="COMPLETE_OBJECT_WITH_LABELS" && !checkIds.every(id => row.checks[id]))) throw Error();
    return {id:draft.id,review:draft.review,decision:row.decision,checks:row.checks};
  });
  const approved=restored.filter(r => r.decision==="COMPLETE_OBJECT_WITH_LABELS");
  if (approved.some((r,i) => approved.slice(0,i).some(o => overlaps(r.review.selection,o.review.selection)))) throw Error();
  return restored;
}
for (const id of checkIds) $(id).addEventListener("change", () => {
  const row=rows[index]; row.checks[id]=$(id).checked;
  // Revoking any check revokes an existing approval immediately.
  if (row.decision==="COMPLETE_OBJECT_WITH_LABELS") row.decision="UNREVIEWED";
  dirty=true; stats(); updateApproval();
});
$("previous").addEventListener("click", () => show(Math.max(0,index-1)));
$("next").addEventListener("click", () => show(Math.min(rows.length-1,index+1)));
$("zoom").addEventListener("change", zoom);
$("compareChoice").addEventListener("change",()=>{
  compareIndex=Number($("compareChoice").value);renderComparison();
  $("compareView").scrollTop=0;$("compareView").scrollLeft=0;
});
$("openComparison").addEventListener("click",()=>{if(compareIndex!==null)show(compareIndex);});
$("compareCrop").addEventListener("error",()=>{if(compareIndex!==null)message("相交裁片未能完整打开，请重新生成预览。");});
$("draw").addEventListener("click",()=>{if(loaded)setDrawing(!drawing);});
$("pageCanvas").addEventListener("pointerdown",event=>{
  if(!drawing || !loaded || event.button!==0 || !event.isPrimary) return;
  event.preventDefault(); drag={start:point(event),pointer:event.pointerId}; $("pageCanvas").setPointerCapture(event.pointerId);
});
$("pageCanvas").addEventListener("pointerup",event=>{
  if(!drag || drag.pointer!==event.pointerId) return;
  const start=drag.start, end=point(event); setDrawing(false);
  if(Math.abs(start.x-end.x)<1 || Math.abs(start.y-end.y)<1) {message("请拖出有宽高的矩形，当前裁片未改变。");return;}
  changeSelection({...rows[index].review.selection,left:Math.floor(Math.min(start.x,end.x)),top:Math.floor(Math.min(start.y,end.y)),
    right:Math.ceil(Math.max(start.x,end.x)),bottom:Math.ceil(Math.max(start.y,end.y))});
});
$("pageCanvas").addEventListener("pointermove",event=>{
  if(!drag || drag.pointer!==event.pointerId)return;
  const start=drag.start,end=point(event),context=batch.pages[rows[index].review.selection.page];
  renderMarkers();const marker=document.createElement("div");marker.className="marker draft";
  Object.assign(marker.style,{left:`${100*Math.min(start.x,end.x)/context.width}%`,top:`${100*Math.min(start.y,end.y)/context.height}%`,
    width:`${100*Math.abs(start.x-end.x)/context.width}%`,height:`${100*Math.abs(start.y-end.y)/context.height}%`});
  $("markers").append(marker);
});
$("pageCanvas").addEventListener("pointercancel",()=>{setDrawing(false);renderMarkers();});
$("setEdges").addEventListener("click",()=>{
  if(!loaded)return;
  if(edges.some(k=>$(k).value.trim()==="")) {message("请填写四条边界。");return;}
  changeSelection({...rows[index].review.selection,...Object.fromEntries(edges.map(k=>[k,Number($(k).value)]))});
});
$("discardEdit").addEventListener("click",()=>changeSelection({...rows[index].review.selection}));
function download(value,name) {
  const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:"application/json"}));
  const link=document.createElement("a");link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$("saveEdits").addEventListener("click",()=>{
  const changed=edits.filter(Boolean);
  if(!changed.length)return;
  if(changed.some((s,i)=>changed.slice(0,i).some(o=>overlaps(s,o)))) {message("改框请求互相重叠。请撤销重复版本，只保留完整的一份。");return;}
  download({schema:1,purpose:"selection-edits",items:rows.map((r,i)=>({id:r.id,review:r.review,
    pageSha256:batch.pages[r.review.selection.page].sha256,selection:edits[i]}))},"crop-selection-edits.json");
  message("已下载改框请求（不含批准）。请重新生成生产预览，再逐张复核。复核进度仍须另行保存。");
});
$("resumeEdits").addEventListener("change",async event=>{
  const file=event.target.files[0];if(!file)return;
  try {
    if(file.size>2*1024*1024)throw Error();const saved=JSON.parse(await file.text());
    if(saved.schema!==1 || saved.purpose!=="selection-edits" || !Array.isArray(saved.items) || saved.items.length!==rows.length)throw Error();
    const byId=new Map(saved.items.map(r=>[r.id,r]));if(byId.size!==rows.length)throw Error();
    const restored=rows.map(r=>{
      const s=byId.get(r.id);
      if(!s || JSON.stringify(s.review)!==JSON.stringify(r.review) || s.pageSha256!==batch.pages[r.review.selection.page].sha256 ||
        (s.selection!==null && (!validSelection(s.selection,r.review.selection) || edges.every(k=>s.selection[k]===r.review.selection[k]))))throw Error();
      return s.selection;
    });
    const changed=restored.filter(Boolean);
    if(!changed.length || changed.some((s,i)=>changed.slice(0,i).some(o=>overlaps(s,o))))throw Error();
    edits=restored;
    rows.forEach((r,i)=>{if(edits[i]){r.decision="UNREVIEWED";r.checks=Object.fromEntries(checkIds.map(id=>[id,false]));}});
    dirty=true;await show(index);message("已恢复改框草稿。改过的裁片须重新生成预览和复核。");
  } catch {message("无法恢复改框：批次、原页或边界不符。当前草稿未改变。");}
  event.target.value="";
});
$("approve").addEventListener("click", () => decide("COMPLETE_OBJECT_WITH_LABELS"));
$("replaceApproval").addEventListener("click", () => decide("COMPLETE_OBJECT_WITH_LABELS",true));
$("reject").addEventListener("click", () => decide("REJECTED"));
$("reset").addEventListener("click", () => decide("UNREVIEWED"));
$("save").addEventListener("click", () => {
  download({schema:1,items:rows},"crop-review-decisions.json"); dirty=edits.some(Boolean);
  message("已下载复核进度。请保存在本机的私有材料目录。");
});
$("resume").addEventListener("change", async event => {
  const file=event.target.files[0]; if(!file) return;
  try {if(file.size>2*1024*1024 || edits.some(Boolean)) throw Error();
    const restored=validateResume(JSON.parse(await file.text())); rows=restored; dirty=false; await show(index);
    message("已恢复这批裁片的复核进度。");
  } catch {message("无法恢复：文件不属于当前预览，或复核记录不完整。当前决定未改变。");}
  event.target.value="";
});
window.addEventListener("beforeunload", event => {if(dirty) {event.preventDefault();event.returnValue="";}});
show(0);
</script>
